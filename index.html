<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Seat Finder</title>

<style>
:root{ --theme-color:#c084fc; }

html,body{
  margin:0;
  padding:0;
  height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  background:
    linear-gradient(rgba(255,255,255,.85),rgba(255,255,255,.85)),
    url("background.png") no-repeat center center fixed;
  background-size:cover;
  overflow:hidden;
}

.container{
  width:100%;
  max-width:480px;
  padding:16px;
}

.card{
  background:#fff;
  border-radius:22px;
  padding:36px 28px;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
  text-align:center;
  animation:fadeUp .8s ease forwards;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:none}
}

h1{
  font-size:24px;
  font-weight:600;
  line-height:1.3;
  margin-bottom:6px;
}

.subtitle{
  color:#555;
  margin-bottom:22px;
}

input{
  width:100%;
  max-width:350px;
  padding:16px;
  font-size:18px;
  border-radius:14px;
  border:1px solid #ddd;
  text-align:center;
}

input:focus{
  outline:none;
  border-color:var(--theme-color);
  box-shadow:0 0 0 4px rgba(192,132,252,.25);
}

.results{
  margin-top:18px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.result{
  background:#f9fafb;
  border-radius:14px;
  padding:14px;
  cursor:pointer;
  transition:.2s;
}

.result:hover{
  background:#ede9fe;
}

.name{font-weight:600}
.seat{
  font-size:18px;
  font-weight:700;
  color:#e11d48;
  margin-top:6px;
}

/* POPUP */
.popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(.6);
  opacity:0;
  background:#fff5f7;
  border-radius:26px;
  padding:36px 30px;
  box-shadow:0 25px 70px rgba(0,0,0,.25);
  text-align:center;
  z-index:20;
  transition:.5s ease;
  pointer-events:none;
}

.popup.show{
  transform:translate(-50%,-50%) scale(1);
  opacity:1;
  pointer-events:auto;
  animation:glow 2s infinite;
}

@keyframes glow{
  0%{box-shadow:0 0 0 rgba(255,120,160,.4)}
  50%{box-shadow:0 0 35px rgba(255,120,160,.6)}
  100%{box-shadow:0 0 0 rgba(255,120,160,.4)}
}

/* TABLE CIRCLE */
.table-circle{
  width:140px;
  height:140px;
  border-radius:50%;
  background:linear-gradient(135deg,#c084fc,#f472b6);
  color:white;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  font-weight:700;
  margin:20px auto;
